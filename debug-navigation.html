<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Navigation Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0a0a0d;
            color: white;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 13, 0.9);
            padding: 20px;
            z-index: 1000;
        }
        
        .nav {
            display: flex;
            gap: 20px;
        }
        
        .nav a {
            color: #f7e98e;
            text-decoration: none;
            padding: 10px 15px;
            border: 1px solid #f7e98e;
            border-radius: 5px;
        }
        
        .nav a:hover {
            background: #f7e98e;
            color: #0a0a0d;
        }
        
        .section {
            height: 100vh;
            padding: 100px 20px 20px;
            border: 2px solid #f7e98e;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        #section1 { background: #1a1a1f; }
        #section2 { background: #2a2a2f; }
        #section3 { background: #3a3a3f; }
        
        .debug {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="#section1" onclick="debugClick(this)">Секция 1</a>
            <a href="#section2" onclick="debugClick(this)">Секция 2</a>
            <a href="#section3" onclick="debugClick(this)">Секция 3</a>
        </nav>
    </header>
    
    <div class="section" id="section1">
        <h2>СЕКЦИЯ 1 - Тест навигации</h2>
    </div>
    
    <div class="section" id="section2">
        <h2>СЕКЦИЯ 2 - Тест навигации</h2>
    </div>
    
    <div class="section" id="section3">
        <h2>СЕКЦИЯ 3 - Тест навигации</h2>
    </div>
    
    <div class="debug" id="debug">
        Debug info will appear here...
    </div>
    
    <script>
        console.log('🚀 Debug navigation loaded');
        
        function debugClick(element) {
            const href = element.getAttribute('href');
            const target = document.querySelector(href);
            
            console.log('🎯 Clicked:', href);
            console.log('🔍 Target found:', !!target);
            
            const debugEl = document.getElementById('debug');
            debugEl.innerHTML = `
                Clicked: ${href}<br>
                Target found: ${!!target}<br>
                Target position: ${target ? target.offsetTop : 'N/A'}<br>
                Time: ${new Date().toLocaleTimeString()}
            `;
            
            if (target) {
                const headerHeight = 80;
                const targetTop = target.offsetTop - headerHeight;
                
                console.log('📍 Scrolling to:', targetTop);
                
                window.scrollTo({
                    top: targetTop,
                    behavior: 'smooth'
                });
            }
        }
        
        // Also test with event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('a[href^="#"]');
            console.log('🔗 Found links:', links.length);
            
            links.forEach((link, index) => {
                console.log(`Link ${index}:`, link.href, link.getAttribute('href'));
            });
        });
    </script>
</body>
</html>
