<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ТЕСТ НАВИГАЦИИ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { font-family: Arial, sans-serif; }
        
        /* НАВИГАЦИЯ */
        .nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 30px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav a:hover {
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }
        
        .nav a.active {
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.2);
        }
        
        /* СЕКЦИИ */
        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            text-align: center;
        }
        
        #about { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        #brands { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        #philosophy { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        #timeline { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        #gallery { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        #press { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        #contact { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
    </style>
</head>
<body>
    <!-- НАВИГАЦИЯ -->
    <nav class="nav">
        <a href="#about">О Мехаке</a>
        <a href="#brands">Бренды</a>
        <a href="#philosophy">Философия</a>
        <a href="#timeline">Путь</a>
        <a href="#gallery">Галерея</a>
        <a href="#press">Пресса</a>
        <a href="#contact">Контакты</a>
    </nav>

    <!-- СЕКЦИИ -->
    <section id="about" class="section">
        <div>
            <h1>О МЕХАКЕ</h1>
            <p>Биография основателя</p>
        </div>
    </section>

    <section id="brands" class="section">
        <div>
            <h1>БРЕНДЫ</h1>
            <p>The Бык • The Пиво • Mocsa</p>
        </div>
    </section>

    <section id="philosophy" class="section">
        <div>
            <h1>ФИЛОСОФИЯ</h1>
            <p>Принципы ведения бизнеса</p>
        </div>
    </section>

    <section id="timeline" class="section">
        <div>
            <h1>ПУТЬ К УСПЕХУ</h1>
            <p>Этапы развития компании</p>
        </div>
    </section>

    <section id="gallery" class="section">
        <div>
            <h1>ГАЛЕРЕЯ</h1>
            <p>Фотографии ресторанов</p>
        </div>
    </section>

    <section id="press" class="section">
        <div>
            <h1>В ПРЕССЕ</h1>
            <p>Статьи и интервью</p>
        </div>
    </section>

    <section id="contact" class="section">
        <div>
            <h1>КОНТАКТЫ</h1>
            <p>Свяжитесь с нами</p>
        </div>
    </section>

    <script>
        console.log('🚀 ТЕСТОВАЯ НАВИГАЦИЯ');
        
        // Простейший код
        document.querySelectorAll('.nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                const href = this.getAttribute('href');
                console.log('КЛИК:', href);
                
                const target = document.querySelector(href);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    console.log('СКРОЛЛ К:', href);
                } else {
                    console.error('НЕ НАЙДЕНО:', href);
                }
                
                // Активная ссылка
                document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        console.log('✅ ГОТОВО');
    </script>
</body>
</html>
